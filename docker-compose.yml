version: '3.8'

services:
  api:
    build: 
      context: .
      dockerfile: Dockerfile
    image: juki-be:latest
    container_name: juki-api
    restart: unless-stopped
    ports:
      - "${APP_PORT:-3000}:3000"
    environment:
      NODE_ENV: production
      # Database connection
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_USER: ${POSTGRES_USER:-juki}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-juki123}
      POSTGRES_DB: ${POSTGRES_DB:-juki_db}
      DATABASE_URL: postgresql://${POSTGRES_USER:-juki}:${POSTGRES_PASSWORD:-juki123}@postgres:5432/${POSTGRES_DB:-juki_db}?schema=public
      # Secrets (Pastikan diset di .env server)
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET}
      JWT_ACCESS_EXPIRES_IN: ${JWT_ACCESS_EXPIRES_IN:-15m}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET}
      JWT_REFRESH_EXPIRES_IN: ${JWT_REFRESH_EXPIRES_IN:-7d}
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./uploads:/app/uploads
      - ./logs:/app/logs
    networks:
      - juki-network

  postgres:
    image: postgres:16-alpine
    container_name: juki-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-juki}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-juki123}
      POSTGRES_DB: ${POSTGRES_DB:-juki_db}
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-juki} -d ${POSTGRES_DB:-juki_db}"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - juki-network

volumes:
  postgres_data:
    driver: local

networks:
  juki-network:
    driver: bridge
